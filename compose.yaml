services:
  epexpredictor:
    #image: ghcr.io/<github-owner>/epexpredictor:latest # or :main / :v0.0.1
    build: .
    # restart: unless-stopped
    ports:
      - "8000:80"

    volumes:
      - ./data:/data
      - ./predictor:/code/predictor  # live-reload: code changes apply without rebuild
    
    environment:
      - EPEXPREDICTOR_DATADIR=/data/
      - EPEXPREDICTOR_ENABLE_REQUEST_TRAINING=false
      - EPEXPREDICTOR_ENTSOE_API_KEY=a041ec42-b02f-4c3b-869d-b88119faf94a
      - EPEXPREDICTOR_FINGRID_API_KEY=56dfc7705cea423aaa47152c6192b48a

  forecast-worker:
    build: .
    command: ["python", "-m", "predictor.forecastworker", "--regions", "FI", "--interval-hours", "3"]
    volumes:
      - ./data:/data
      - ./predictor:/code/predictor  # live-reload: code changes apply without rebuild
    environment:
      - EPEXPREDICTOR_DATADIR=/data/
      - EPEXPREDICTOR_ENABLE_REQUEST_TRAINING=false
      - EPEXPREDICTOR_ENTSOE_API_KEY=a041ec42-b02f-4c3b-869d-b88119faf94a
      - EPEXPREDICTOR_FINGRID_API_KEY=56dfc7705cea423aaa47152c6192b48a
